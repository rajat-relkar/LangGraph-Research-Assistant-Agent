# pyproject.toml - the project's manifest: name, Python version and dependencies.
# `uv` reads this file; `uv sync` installs everything listed here and records the exact
# resolved versions in uv.lock (commit uv.lock so every machine gets identical packages).
[project]
name = "langgraph-research-agent"
version = "0.1.0"
description = "Add your description here"
# README.md is shown as the long description if the package is ever published.
readme = "README.md"
# Minimum Python version (must match .python-version, which tells uv which interpreter to create the .venv with).
requires-python = ">=3.14"
dependencies = [
    # Cross-platform coloured terminal text. Currently NOT imported anywhere in src/.
    "colorama>=0.4.6",
    # Compatibility package that installs `python-dotenv`; gives `from dotenv import load_dotenv` to read .env files.
    "dotenv>=0.9.9",
    # LangChain core framework: messages (SystemMessage, HumanMessage), chat-model interface, structured output.
    "langchain>=1.4.7",
    # Community-maintained integrations. Currently NOT used by this project.
    "langchain-community>=0.4.2",
    # ChatGroq: the LLM provider actually used (src/utils/models.py). Needs GROQ_API_KEY.
    "langchain-groq>=1.1.3",
    # OpenAI integration. Currently NOT used (the project runs on Groq).
    "langchain-openai>=1.7.2",
    # TavilySearch web-search tool (src/utils/nodes.py). Needs TAVILY_API_KEY.
    "langchain-tavily>=0.2.18",
    # LangGraph: StateGraph, Send, interrupt, MessagesState - the orchestration engine.
    "langgraph>=1.2.17",
    # LangGraph CLI. `inmem` adds the in-memory dev server behind `langgraph dev` (used with LangGraph Studio).
    # ("inemem" is a misspelt duplicate extra; only "inmem" matters.)
    "langgraph-cli[inemem,inmem]>=0.4.38",
]
